<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembrei</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variable.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <header>

    <a href="index.html" class="marca">
      <img src="assets/icons/logo.png" alt="Lembrei - voltar ao início">
      <h1 id="titulo"> Lembrei! </h1>
    </a>

    <search>

      <label for="campo-busca" class="visually-hidden">Buscar Tarefa</label>

      <div class="busca-caixa">
        <button type="button" id="botao-busca" aria-label="Buscar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <line x1="16.5" y1="16.5" x2="21" y2="21" />
          </svg>
        </button>

        <input type="search" id="campo-busca" placeholder="Buscar tarefa...">
      </div>

    </search>

    <button type="button" id="botao-nova-tarefa">Nova tarefa</button>

  </header>

  <div class="barra-filtros">
    <label for="filtro-prioridade">Prioridade</label>
    <select id="filtro-prioridade">
      <option value="todas">Todas</option>
      <option value="alta">Alta</option>
      <option value="media">Média</option>
      <option value="baixa">Baixa</option>
    </select>
  </div>

  <main>
    <section class="coluna" id="coluna-a-definir" data-status="a-definir">
      <h2>A definir</h2>
      <div class="lista-tarefas"></div>
    </section>

    <section class="coluna" id="coluna-em-andamento" data-status="em-andamento">
      <h2>Em andamento</h2>
      <div class="lista-tarefas"></div>
    </section>

    <section class="coluna" id="coluna-concluida" data-status="concluida">
      <h2>Concluídas</h2>
      <div class="lista-tarefas"></div>
    </section>

  </main>

  <dialog id="modal-tarefa">
    <form id="form-tarefa">
      <div class="modal-header">
        <div>
          <h2 id="modal-titulo">Nova tarefa</h2>
          <p class="subtitulo">Organize os detalhes e prazos da sua tarefa.</p>
        </div>
        <button type="button" id="botao-fechar" aria-label="Fechar">✕</button>
      </div>

      <div class="campo">
        <label for="tarefa-titulo">Título <span>*</span></label>
        <input type="text" id="tarefa-titulo" placeholder="Ex: Estudar JavaScript..." required>
      </div>

      <div class="linha-dupla">
        <div class="campo">
          <label for="prioridade">Prioridade</label>
          <select id="prioridade">
            <option value="alta">Alta</option>
            <option value="media" selected>Média</option>
            <option value="baixa">Baixa</option>
          </select>
        </div>

        <div class="divisor"></div>

        <div class="campo">
          <label for="prazo">Prazo</label>
          <input type="date" id="prazo">
        </div>
      </div>

      <div class="acoes">
        <button type="button" id="botao-cancelar" class="botao-secundario">Cancelar</button>

        <button type="submit" class="botao-primario" id="botao-salvar">✓ Criar tarefa</button>
      </div>
    </form>
  </dialog>
</body>

</html>
