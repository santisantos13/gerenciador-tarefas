<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembrei</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variable.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <header>

    <h1 id="titulo"> Lembrei! </h1>

    <div>
      <search>
        <label for="campo-busca" class="visually-hidden">Buscar Tarefa</label>
        <input type="search" id="campo-busca" placeholder="Buscar tarefa...">
        <button id="botao-busca">Buscar</button>
      </search>

      <div>
        <button type="button" id="botao-nova-tarefa">Nova tarefa</button>
      </div>
    </div>
  </header>

  <main>
    <section class="coluna" id="coluna-a-definir" data-status="a-definir">
      <h2>A definir</h2>
      <div class="lista-tarefas"></div>
    </section>

    <section class="coluna" id="coluna-em-andamento" data-status="em-andamento">
      <h2>Em andamento</h2>
      <div class="lista-tarefas"></div>
    </section>

    <section class="coluna" id="coluna-concluida" data-status="concluida">
      <h2>Concluídas</h2>
      <div class="lista-tarefas"></div>
    </section>

  </main>

</body>

</html>
