<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembrei</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variable.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <header>

    <a href="index.html" class="marca">
      <img src="assets/icons/logo.png" alt="Lembrei - voltar ao início">
      <h1 id="titulo"> Lembrei! </h1>
    </a>


    <search>
      <label for="campo-busca" class="visually-hidden">Buscar Tarefa</label>

      <div class="busca-caixa">
        <button type="button" id="botao-busca" aria-label="Buscar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <line x1="16.5" y1="16.5" x2="21" y2="21" />
          </svg>
        </button>

        <input type="search" id="campo-busca" placeholder="Buscar tarefa...">
      </div>

    </search>


    <button type="button" id="botao-nova-tarefa">Nova tarefa</button>


  </header>

  <main>
    <section class="coluna" id="coluna-a-definir" data-status="a-definir">
      <h2>A definir</h2>
      <div class="lista-tarefas">

        <article class="card-tarefa">
          <h3>Estudar JavaScript</h3>
          <span class="badge-prioridade" data-prioridade="alta">Alta</span>
          <p class="prazo">Prazo: 01/12/2026</p>
        </article>

        <article class="card-tarefa">
          <h3>Estudar Python</h3>
          <span class="badge-prioridade" data-prioridade="media">Média</span>
          <p class="prazo">Prazo: 01/01/2027</p>
        </article>

        <article class="card-tarefa">
          <h3>Vegetar</h3>
          <span class="badge-prioridade" data-prioridade="baixa">Baixa</span>
          <p class="prazo">Prazo: indefinido</p>
        </article>

      </div>
    </section>

    <section class="coluna" id="coluna-em-andamento" data-status="em-andamento">
      <h2>Em andamento</h2>
      <div class="lista-tarefas"></div>
    </section>

    <section class="coluna" id="coluna-concluida" data-status="concluida">
      <h2>Concluídas</h2>
      <div class="lista-tarefas"></div>
    </section>

  </main>

</body>

</html>
