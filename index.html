<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembrei</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variable.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>

  <div class="app">
    <aside class="sidebar">
      <a href="index.html" class="marca">
        <img src="assets/icons/logo.png" alt="Lembrei - voltar ao início">
        <h1 id="titulo"> Lembrei! </h1>
      </a>

      <nav>
        <a href="index.html" aria-current="page">Meu mural</a>
      </nav>
    </aside>

    <div class="conteudo">

      <header class="topo">
        <div class="saudacao">
          <h2>E aí, o que temos para hoje?</h2>
          <p>Tire da cabeça. Coloque no papel.</p>
        </div>

        <search>
          <label for="campo-busca" class="visually-hidden">Buscar Tarefa</label>

          <div class="busca-caixa">
            <button type="button" id="botao-busca" aria-label="Buscar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <line x1="16.5" y1="16.5" x2="21" y2="21" />
              </svg>
            </button>
            <input type="search" id="campo-busca" placeholder="Buscar tarefa...">
          </div>

        </search>

      </header>

      <div class="barra-acoes">
        <button type="button" id="botao-nova-tarefa">Novo Post-it</button>

        <div class="barra-filtros">
          <label for="filtro-prioridade">Prioridade</label>
          <select id="filtro-prioridade">
            <option value="todas">Todas</option>
            <option value="alta">Alta</option>
            <option value="media">Média</option>
            <option value="baixa">Baixa</option>
          </select>
        </div>
      </div>

      <main>
        <section class="coluna" id="coluna-a-definir" data-status="a-definir">
          <div class="coluna-topo">
            <h2>A definir</h2>
            <span class="contador">0</span>
          </div>
          <div class="lista-tarefas"></div>
        </section>

        <section class="coluna" id="coluna-em-andamento" data-status="em-andamento">
          <div class="coluna-topo">
            <h2>Em andamento</h2>
            <span class="contador">0</span>
          </div>
          <div class="lista-tarefas"></div>
        </section>

        <section class="coluna" id="coluna-concluida" data-status="concluida">
          <div class="coluna-topo">
            <h2>Concluídas</h2>
            <span class="contador">0</span>
          </div>
          <div class="lista-tarefas"></div>
        </section>
      </main>

    </div>
  </div>

  <dialog id="modal-tarefa">
    <form id="form-tarefa">
      <div class="modal-header">
        <div>
          <h2 id="modal-titulo">Nova tarefa</h2>
          <p class="subtitulo">Organize os detalhes e prazos da sua tarefa.</p>
        </div>
        <button type="button" id="botao-fechar" aria-label="Fechar">✕</button>
      </div>

      <div class="campo">
        <label for="tarefa-titulo">Título <span>*</span></label>
        <input type="text" id="tarefa-titulo" placeholder="Ex: Estudar JavaScript..." maxlength="50" required>
        <small class="contador-caracteres" id="contador-titulo">0/50</small>
      </div>

      <div class="campo">
        <label for="tarefa-descricao">Descrição (opcional)</label>
        <textarea id="tarefa-descricao" placeholder="Adicione mais detalhes sobre sua tarefa..." maxlength="200"
          rows="3"></textarea>
        <small class="contador-caracteres" id="contador-descricao">0/200</small>
      </div>

      <fieldset class="campo-cores">
        <legend>Cor do Post-it</legend>
        <div class="cores">
          <label class="opcao-cor">
            <input type="radio" name="cor" value="amarelo" class="visually-hidden" checked>
            <span class="bolinha" data-cor="amarelo"></span>
            <span class="visually-hidden">Amarelo</span>
          </label>
          <label class="opcao-cor">
            <input type="radio" name="cor" value="azul" class="visually-hidden">
            <span class="bolinha" data-cor="azul"></span>
            <span class="visually-hidden">Azul</span>
          </label>
          <label class="opcao-cor">
            <input type="radio" name="cor" value="lilas" class="visually-hidden">
            <span class="bolinha" data-cor="lilas"></span>
            <span class="visually-hidden">Lilás</span>
          </label>
          <label class="opcao-cor">
            <input type="radio" name="cor" value="verde" class="visually-hidden">
            <span class="bolinha" data-cor="verde"></span>
            <span class="visually-hidden">Verde</span>
          </label>
          <label class="opcao-cor">
            <input type="radio" name="cor" value="pessego" class="visually-hidden">
            <span class="bolinha" data-cor="pessego"></span>
            <span class="visually-hidden">Pêssego</span>
          </label>
        </div>
      </fieldset>

      <div class="linha-dupla">
        <div class="campo">
          <label for="prioridade">Prioridade</label>
          <select id="prioridade">
            <option value="alta">Alta</option>
            <option value="media" selected>Média</option>
            <option value="baixa">Baixa</option>
          </select>
        </div>

        <div class="divisor"></div>

        <div class="campo">
          <label for="prazo">Prazo</label>
          <input type="date" id="prazo">
        </div>
      </div>

      <div class="acoes">
        <button type="button" id="botao-cancelar" class="botao-secundario">Cancelar</button>

        <button type="submit" class="botao-primario" id="botao-salvar">✓ Criar tarefa</button>
      </div>
    </form>
  </dialog>
</body>

</html>
